<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <style>
    .title { font: 700 30px 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill:#4B4E6D; }
    .mode  { font: 700 20px 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill:#A078C8; }
    .lbl   { font: 700 20px 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill:#4B4E6D; }
    .pct   { font: 700 20px 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill:#4B4E6D; }
    .log   { font: 600 19px 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill:#F3E9FF; }
  </style>
  <rect x="3" y="3" width="994" height="494" rx="6" fill="#FFF8EE" stroke="#4B4E6D" stroke-width="6"/>
  <rect x="20" y="20" width="960" height="460" rx="4" fill="none" stroke="#F7B7D2" stroke-width="3"/>

  <text x="44" y="64" class="title">SYSTEM STATUS</text>
  <circle cx="752" cy="57" r="6" fill="#8FD3B6">
    <animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="772" y="64" class="mode">MODE: BUILDING</text>
  <line x1="40" y1="82" x2="960" y2="82" stroke="#FFC8AA" stroke-width="4" stroke-dasharray="10 8"/>

  <text x="44" y="124" class="lbl">BACKEND APIs</text>
  <rect x="290" y="106" width="500" height="22" rx="4" fill="#EFE3D6" stroke="#4B4E6D" stroke-width="2"/>
  <rect x="293" y="109" width="444" height="16" rx="3" fill="#F7B7D2">
    <animate attributeName="width" from="0" to="444" begin="0.30s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="808" y="124" class="pct">90%</text>
  <text x="44" y="164" class="lbl">DATABASES</text>
  <rect x="290" y="146" width="500" height="22" rx="4" fill="#EFE3D6" stroke="#4B4E6D" stroke-width="2"/>
  <rect x="293" y="149" width="419" height="16" rx="3" fill="#C9B6F2">
    <animate attributeName="width" from="0" to="419" begin="0.45s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="808" y="164" class="pct">85%</text>
  <text x="44" y="204" class="lbl">AGENTIC AI</text>
  <rect x="290" y="186" width="500" height="22" rx="4" fill="#EFE3D6" stroke="#4B4E6D" stroke-width="2"/>
  <rect x="293" y="189" width="355" height="16" rx="3" fill="#A8E6CF">
    <animate attributeName="width" from="0" to="355" begin="0.60s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="808" y="204" class="pct">72%</text>
  <text x="44" y="244" class="lbl">CI/CD</text>
  <rect x="290" y="226" width="500" height="22" rx="4" fill="#EFE3D6" stroke="#4B4E6D" stroke-width="2"/>
  <rect x="293" y="229" width="345" height="16" rx="3" fill="#FFD29D">
    <animate attributeName="width" from="0" to="345" begin="0.75s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="808" y="244" class="pct">70%</text>
  <text x="44" y="284" class="lbl">GERMAN A1</text>
  <rect x="290" y="266" width="500" height="22" rx="4" fill="#EFE3D6" stroke="#4B4E6D" stroke-width="2"/>
  <rect x="293" y="269" width="172" height="16" rx="3" fill="#FFEDA8">
    <animate attributeName="width" from="0" to="172" begin="0.90s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="808" y="284" class="pct">35%</text>

  <rect x="36" y="318" width="928" height="168" rx="8" fill="#3B3350" stroke="#4B4E6D" stroke-width="3"/>
  <text x="62" y="346" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#B9A6E8">LOG</text>
  <text x="62" y="374" class="log">&gt; shipped 12+ features to a live app with 200+ users
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="62" y="400" class="log">&gt; reconciled 10,000+ records with 4 matching strategies
    <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="62" y="426" class="log">&gt; feed payload cut from 3.0 MB to 6 KB
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="62" y="452" class="log">&gt; 400+ DSA problems solved on LeetCode &amp; CodeChef
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="62" y="470" class="log" fill="#FFB8D1">_
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.8s" repeatCount="indefinite"/>
  </text>
</svg>
